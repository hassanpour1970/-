name: dealer_audit
description: ارزیابی نمایندگی‌های خدمات پس از فروش ایران خودرو دیزل (آفلاین)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # state
  flutter_riverpod: ^2.5.1

  # database (offline)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Jalali
  shamsi_date: ^1.0.1
  persian_datetime_picker: ^3.0.0

  # fields
  geolocator: ^12.0.0
  image_picker: ^1.1.2
  signature: ^5.5.0
  permission_handler: ^11.3.1

  # export / backup
  excel: ^4.0.6
  archive: ^3.6.1
  file_picker: ^8.0.6
  share_plus: ^9.0.0

  uuid: ^4.4.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
